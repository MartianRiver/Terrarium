# Every range of seeds used for anything that decides. A score only checks anything if nothing
# was chosen by the seeds it uses, so a block is taken before it's used:
#   cd sim && uv run python -m terrarium.seeds take --use confirm --what "..." --where "findings/NNNN"
# prints the start of the next free block of 1,000 and writes it here. Edit by hand if you must;
# no two blocks may overlap (check.py reads this file). use is choosing, confirm, scratch or test.
# Choosing blocks are retired for confirming; a block's size is how many games were played from it.

[[block]]
start = 1_000_000
size = 1000
use = "choosing"
what = "the default worlds (evals and games without --held-out or --seed): training-time checks and most choosing"
where = "docs/evals.md"
date = 2026-11-05

