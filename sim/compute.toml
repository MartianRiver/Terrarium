# Rented machines, one [[session]] each, oldest first. The hours of training come
# from the runs themselves (runs/); this is what each rental cost, setup,
# downloads and idle time included; `cpu` is the CPU and the cores the rental
# came with. `ended` decides which stage a session counts towards, and
# `python -m terrarium.compute vast` checks `dollars` against Vast.
# [[machine]] names my own machines by the cpu and memory their runs record (or the
# platform, for runs from before those were recorded).

[[machine]]
cpu = "Apple M3"
memory_gb = 16
# runs from before cpu and memory were recorded say only their platform; my only Mac has been this one
platform = "macOS"
name = "MacBook Air 15-inch, M3, 16 GB unified memory"
# its name on the board (its queue token's handle)
handle = "river-m3"

# GPU memory by model, for the board, where every Vast offer of the model has the same (checked 2026-10-26).
# Vast forgets a destroyed instance, so the 3080 (10 or 20 GB) and 4060 Ti (8 or 16) go by model unless
# a session has its own gpu_memory_gb.
[gpu_memory]
"RTX 3060" = 12
"RTX 3070" = 8
"A10" = 24

