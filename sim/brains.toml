# The brain each stage settled on, oldest first, added by terrarium.promote
# (docs/training.md). Weights never go in git: each brain is attached to its
# stage's GitHub release as `file`, with a copy in brains/ in the local backups.
# `parent` is empty for a brain trained from scratch.
# `like` is the animal it's sort of on the level of (docs/brain.md). `compute` is
# what got it here (terrarium.compute): its own runs and its parents', every run
# and rental in the stage (scratch and abandoned ones too), and all stages so far.

