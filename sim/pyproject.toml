[project]
name = "terrarium-sim"
version = "0.1.0"
description = "Headless sim for Terrarium"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "pymunk>=7.3.1",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# PyPI's Linux torch wheels bring CUDA (gigabytes); CI only needs the CPU build. macOS stays on PyPI, which has MPS.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[build-system]
requires = ["uv_build>=0.12.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "terrarium"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
