[project]
name = "terrarium-sim"
version = "0.2.0"
description = "Headless sim for Terrarium"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "pymunk>=7.3.1",
    "torch>=2.14.1; sys_platform != 'linux'",
]

# On Linux torch comes with one of these: uv sync --extra cpu, or --extra cuda for an NVIDIA GPU
# (CUDA 12.6 builds). PyPI's Linux wheels would bring CUDA whether it's wanted or not.
[project.optional-dependencies]
cpu = [
    "torch>=2.14.1; sys_platform == 'linux'",
]
cuda = [
    "torch>=2.14.1; sys_platform == 'linux'",
]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cuda" }],
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda" },
]

[build-system]
requires = ["uv_build>=0.12.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "terrarium"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
