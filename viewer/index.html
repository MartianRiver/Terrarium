<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terrarium</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="world" aria-label="3D view of the blob world"></div>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="hud">
      <strong>Terrarium</strong> · <span id="source">scripted demo</span>
      <button id="open" type="button">Open replay</button>
      <input id="file" type="file" accept=".gz,.jsonl" hidden aria-label="Replay file" />
      <a href="/runs.html">Runs</a>
      <span class="hint">drag to orbit · scroll to zoom · click a Terrikin to follow it · V view · F follow · P pause · R restart · or drop a replay anywhere</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
