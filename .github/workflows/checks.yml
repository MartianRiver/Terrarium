name: checks

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

jobs:
  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  sim:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: sim
      - run: uv sync --locked --extra cpu
      - run: uv run --extra cpu pytest -q

  # a replay the sim writes now has to load in the viewer
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: sim
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: uv sync --locked --extra cpu
        working-directory: sim
      - run: uv run --extra cpu python -m terrarium.record "$RUNNER_TEMP/ci.jsonl.gz" --seconds 10
        working-directory: sim
      - run: npm ci
        working-directory: viewer
      - run: REPLAY="$RUNNER_TEMP/ci.jsonl.gz" npx vitest run --reporter verbose
        working-directory: viewer
